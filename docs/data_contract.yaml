# ================================================
# DATA CONTRACT - customers.csv
# ================================================
# Chosen Source: customers.csv
# Reason: This source serves as master customer data with clear quality issues
#         (duplicates and missing values) that require formal validation rules,
#         and it provides the primary key referenced by other sources.

dataset_name: customer_master_data
version: 1.0
owner: "unknown - requires confirmation"
source_type: file
source_format: csv
acquisition_method: "File import using pandas.read_csv() from data/raw/ directory"
expected_update_pattern: "batch"

primary_key: customer_id

schema:
  - name: customer_id
    type: string
    nullable: false
    description: "Unique customer identifier in format C#### (e.g., C0001)"
  
  - name: first_name
    type: string
    nullable: false
    description: "Customer's first name"
  
  - name: last_name
    type: string
    nullable: false
    description: "Customer's last name"
  
  - name: email
    type: string
    nullable: true
    description: "Customer's email address (3 records missing per profiling)"
  
  - name: city
    type: string
    nullable: true
    description: "Customer's city of residence (2 records missing per profiling)"
  
  - name: signup_date
    type: date
    nullable: false
    description: "Date when customer signed up in YYYY-MM-DD format"
  
  - name: customer_segment
    type: string
    nullable: false
    description: "Customer segment classification (Professional, Retail, SME, Student)"

quality_rules:
  - "customer_id must not be null"
  - "customer_id must be unique (247 distinct values found out of 250 rows)"
  - "customer_id must match pattern ^C[0-9]{4}$"
  - "signup_date must be in YYYY-MM-DD format"
  - "signup_date must be between 2025-01-01 and 2026-12-31"
  - "customer_segment must be one of: Professional, Retail, SME, Student"
  - "email must be valid email format when not null"
  - "first_name and last_name must not be empty strings"

freshness_expectation: "unknown - requires confirmation"
duplicate_policy: "deduplicate"
schema_evolution_policy: "Reject and notify if columns are added, removed, or renamed. Allow new values in customer_segment after review."
consumer: "Data engineering pipeline for DSS150P Lab - downstream analytics and reporting"

notes: >
  Known risks and observations from profiling:
  - 2 fully duplicated rows (0.80%) require deduplication
  - 3 missing email addresses (1.20%) and 2 missing cities (0.80%)
  - signup_date is stored as string and must be parsed to date type
  - Only 247 distinct customer_id values out of 250 rows indicate duplicate records
  - Unclear if missing values should be rejected or filled with defaults
  - Source owner confirmation needed for update frequency and freshness expectations